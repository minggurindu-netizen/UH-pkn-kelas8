            if (IS_PREVIEW || !db) return;
            try {
                const soalSnap = await getDocs(collection(db, "soal"));
                if (soalSnap.empty) {
                    for (let i = 0; i < rawSoalText.length; i++) {
                        const item = rawSoalText[i];
                        let opsi = [];
                        if(item.t === 1) opsi = ["Jika (1) dan (2) benar", "Jika (1) dan (3) benar", "Jika (2) dan (3) benar", "Jika (1), (2), dan (3) benar"];
                        else if(item.t === 3) opsi = ["Benar", "Salah"];
                        else opsi = item.o;
                        
                        await addDoc(collection(db, "soal"), {
                            no: i + 1,
                            teks: item.q,
                            tipe: item.t,
                            opsi: opsi,
                            jawaban: item.a,
                            timestamp: serverTimestamp()
                        });
                    }
                }
                const siswaSnap = await getDocs(collection(db, "siswa"));
                if (siswaSnap.empty) {
                    for(let s of realSiswaKls8) {
                        await addDoc(collection(db, "siswa"), s);

            } catch (error) {

            const snap = await getDocs(q);

            snap.forEach(doc => res.push({id: doc.id, ...doc.data()}));
            return res.sort((a,b) => a.nama.localeCompare(b.nama));

                            </div>
                            <div id="container-opsi-pg" class="space-y-2">
                                <label class="block text-sm font-medium text-gray-700">Pilihan Jawaban (A, B, C, D)</label>
                                <input type="text" id="opt-a" placeholder="Opsi A" class="w-full glass-input px-3 py-2 rounded-lg text-sm text-gray-700">
                                <input type="text" id="opt-b" placeholder="Opsi B" class="w-full glass-input px-3 py-2 rounded-lg text-sm text-gray-700">
                                <input type="text" id="opt-c" placeholder="Opsi C" class="w-full glass-input px-3 py-2 rounded-lg text-sm text-gray-700">
                                <input type="text" id="opt-d" placeholder="Opsi D" class="w-full glass-input px-3 py-2 rounded-lg text-sm text-gray-700">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Kunci Jawaban (Contoh: A, B, C, D)</label>
                                <input type="text" id="soal-jawaban" class="w-full glass-input px-3 py-2 rounded-lg text-gray-700 font-bold uppercase" placeholder="A" required>
                            </div>
                            <div class="flex gap-3 pt-2">
                                <button type="button" onclick="tutupModalSoal()" class="flex-1 bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl hover:bg-gray-300 transition">Batal</button>
                                <button type="submit" class="flex-1 bg-purple-600 text-white font-bold py-2.5 rounded-xl hover:bg-purple-700 transition">Simpan Soal</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            
            try {
                const ls = document.getElementById('list-soal');
                const dataSoal = await fetchAllSoal();
                if(dataSoal.length === 0) {
                    ls.innerHTML = '<div class="text-center p-8 text-gray-500 font-medium">Belum ada soal tersimpan.</div>';
                    return;
                }
                let html = '';
                dataSoal.forEach(s => {
                    html += `
                        <div class="glass-dark p-5 rounded-2xl border border-gray-200 shadow-sm transition hover:shadow-md relative group">
                            <div class="absolute top-4 right-4 flex gap-2">
                                <button onclick='editSoal(${JSON.stringify(s).replace(/'/g, "&#39;")})' class="p-2 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded-lg transition" title="Edit Soal"><i class="ph-bold ph-pencil-simple"></i></button>
                                <button onclick="hapusSoal('${s.id}')" class="p-2 bg-red-100 hover:bg-red-200 text-red-600 rounded-lg transition" title="Hapus Soal"><i class="ph-bold ph-trash"></i></button>
                            </div>
                            <div class="flex items-center gap-3 mb-3 pr-24">
                                <span class="font-bold text-sm bg-gray-800 text-white px-3 py-1 rounded-md shadow-sm">No. ${s.no}</span>
                                <span class="text-xs bg-green-100 text-green-700 px-2.5 py-1 rounded-md border border-green-200 font-bold"><i class="ph-bold ph-check"></i> Kunci: ${s.jawaban}</span>
                                <span class="text-xs bg-purple-100 text-purple-700 px-2.5 py-1 rounded-md font-bold">Tipe ${s.tipe}</span>
                            </div>
                            <p class="text-[15px] text-gray-800 mb-4 font-medium leading-relaxed">${s.teks}</p>
                            <div class="text-sm text-gray-600 ml-4 space-y-2 border-l-2 border-purple-200 pl-4">
                                ${s.opsi.map((o, i) => `<div class="flex items-start"><span class="font-bold mr-2">${s.tipe === 3 ? '' : ['A','B','C','D'][i] + '.'}</span> <span>${o}</span></div>`).join('')}
                            </div>
                        </div>`;
                });
                ls.innerHTML = html;
            } catch (error) {
                document.getElementById('list-soal').innerHTML = `<div class="text-center p-8 text-red-500 font-medium">Gagal memuat soal: ${error.message}</div>`;
            }
        };

        window.toggleOpsiForm = (tipe) => {
            const containerPG = document.getElementById('container-opsi-pg');
            if(tipe == '2') containerPG.style.display = 'block';
            else containerPG.style.display = 'none';
        };

        window.bukaModalSoal = (soal = null) => {
            const modal = document.getElementById('modal-soal');
            const form = document.getElementById('form-soal');
            form.reset();
            document.getElementById('soal-doc-id').value = '';
            
            if(soal) {
                document.getElementById('modal-soal-title').innerText = 'Edit Soal No. ' + soal.no;
                document.getElementById('soal-doc-id').value = soal.id;
                document.getElementById('soal-no').value = soal.no;
                document.getElementById('soal-tipe').value = soal.tipe;
                document.getElementById('soal-teks').value = soal.teks;
                document.getElementById('soal-jawaban').value = soal.jawaban;
                
                toggleOpsiForm(soal.tipe);
                if(soal.tipe == 2 && soal.opsi) {
                    document.getElementById('opt-a').value = soal.opsi[0] || '';
                    document.getElementById('opt-b').value = soal.opsi[1] || '';
                    document.getElementById('opt-c').value = soal.opsi[2] || '';
                    document.getElementById('opt-d').value = soal.opsi[3] || '';
                }
            } else {
                document.getElementById('modal-soal-title').innerText = 'Tambah Soal Baru';
                toggleOpsiForm('1');
            }
            modal.classList.remove('hidden');
        };

        window.tutupModalSoal = () => {
            document.getElementById('modal-soal').classList.add('hidden');
        };

        window.editSoal = (s) => {
            bukaModalSoal(s);
        };

        window.simpanSoal = async (e) => {
            e.preventDefault();
            const docId = document.getElementById('soal-doc-id').value;
            const no = parseInt(document.getElementById('soal-no').value);
            const tipe = parseInt(document.getElementById('soal-tipe').value);
            const teks = document.getElementById('soal-teks').value;
            const jawaban = document.getElementById('soal-jawaban').value.trim().toUpperCase();

            let opsi = [];
            if(tipe === 1) {
                opsi = ["Jika (1) dan (2) benar", "Jika (1) dan (3) benar", "Jika (2) dan (3) benar", "Jika (1), (2), dan (3) benar"];
            } else if(tipe === 3) {
                opsi = ["Benar", "Salah"];
            } else {
                opsi = [
                    document.getElementById('opt-a').value,
                    document.getElementById('opt-b').value,
                    document.getElementById('opt-c').value,
                    document.getElementById('opt-d').value
                ];
            }

            try {
                showToast('Menyimpan soal...', 'info');
                if(docId) {
                    await updateDoc(doc(db, "soal", docId), { no, tipe, teks, opsi, jawaban });
                    showToast('Soal berhasil diperbarui!', 'success');
                } else {
                    await addDoc(collection(db, "soal"), { no, tipe, teks, opsi, jawaban, timestamp: serverTimestamp() });
                    showToast('Soal baru berhasil ditambahkan!', 'success');
                }
                tutupModalSoal();
                loadAdminSoal(document.getElementById('admin-content'));
            } catch(err) {
                showToast('Gagal menyimpan soal: ' + err.message, 'error');
            }
        };

        window.hapusSoal = async (id) => {
            showCustomModal("Hapus Soal", "Apakah Anda yakin ingin menghapus soal ini dari database?", async () => {
                try {
                    await deleteDoc(doc(db, "soal", id));
                    showToast('Soal berhasil dihapus', 'success');
                    loadAdminSoal(document.getElementById('admin-content'));
                } catch(err) {
                    showToast('Gagal menghapus: ' + err.message, 'error');
                }
            });
        };

        renderView('login');

        // PWA Service Worker via Blob
        const swCode = `
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', (e) => {});
        `;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(err => console.log('SW Reg failed:', err));
        }
        
        // Auto setup database 2 seconds after load
        setTimeout(() => autoSetupDatabase(), 2000);
    </script>
</body>
</html>
